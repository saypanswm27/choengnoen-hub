<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบศูนย์รวมช่องทางปฏิบัติงานดิจิทัล | Nannaphat Digital Work Portal</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233F;
    --navy-soft: #223257;
    --orange: #E8722A;
    --orange-soft: #F6D9B8;
    --sand: #FBF3E7;
    --yellow: #FFC94D;
    --ink: #333B4D;
    --ink-light: #6B7285;
    --white: #FFFFFF;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Kanit', sans-serif;
  }

  /* ---------- Access Gate ---------- */
  #gate {
    position: fixed;
    inset: 0;
    background: var(--navy);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  #gate img {
    width: 264px;
    max-width: 85%;
    height: auto;
    object-fit: contain;
  }
  #gate h2 {
    color: var(--white);
    margin: 0;
    font-size: 1.3rem;
  }
  #gate input {
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem;
    padding: 12px 44px 12px 16px;
    border-radius: 10px;
    border: none;
    width: 100%;
    max-width: 280px;
    text-align: center;
  }
  .gate-input-wrap {
    position: relative;
    width: 100%;
    max-width: 280px;
  }
  .gate-input-wrap input { max-width: none; }
  .toggle-pw {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    color: var(--ink-light);
  }
  .toggle-pw:hover { color: var(--ink); }
  #gate .toggle-pw {
    background: none;
    color: var(--ink-light);
    padding: 6px;
    transform: translateY(-50%);
  }
  #gate .toggle-pw:hover { color: var(--ink); transform: translateY(-50%); }
  #gate button {
    font-family: 'Kanit', sans-serif;
    background: var(--orange);
    color: var(--white);
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  #gate button:hover { transform: translateY(-1px); }
  #gate-error {
    color: var(--yellow);
    font-size: 0.9rem;
    min-height: 1.2em;
  }

  /* ---------- Layout ---------- */
  #app { display: none; }
  #app.visible { display: block; }

  header.hero {
    background: var(--navy);
    color: var(--white);
    padding: 32px 20px 40px;
  }
  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-logo {
    width: 79px;
    height: 79px;
    object-fit: contain;
    flex-shrink: 0;
    animation: wave-in 0.7s ease-out;
  }
  @keyframes wave-in {
    0% { transform: translateY(-8px) rotate(-6deg); opacity: 0; }
    60% { transform: translateY(2px) rotate(4deg); opacity: 1; }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .hero-text h1 {
    margin: 0 0 2px;
    font-size: 1.5rem;
    line-height: 1.3;
  }
  .hero-text .eng-name {
    margin: 0 0 6px;
    color: #8FA0C4;
    font-size: 0.8rem;
    letter-spacing: 0.3px;
  }
  .hero-text p {
    margin: 0;
    color: #C9D2E3;
    font-size: 0.95rem;
  }

  .search-wrap {
    max-width: 900px;
    margin: -22px auto 0;
    padding: 0 20px;
  }
  .search-box {
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(22,35,63,0.15);
    padding: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-box svg { flex-shrink: 0; margin-left: 12px; color: var(--ink-light); }
  .search-box input {
    border: none;
    outline: none;
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem;
    padding: 14px 12px 14px 0;
    width: 100%;
    background: transparent;
    color: var(--ink);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .tab {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1.5px solid #E3D6C4;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }

  .category-block { margin-bottom: 36px; }
  .category-block:last-child { margin-bottom: 0; }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: 1.1rem;
  }
  .category-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-section { background: var(--navy); }
  .dot-personal { background: var(--orange); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px;
    border-left: 5px solid var(--navy);
    box-shadow: 0 2px 8px rgba(22,35,63,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.accent-personal { border-left-color: var(--orange); }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(22,35,63,0.12);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .card-icon { font-size: 1.6rem; line-height: 1; }
  .card-name {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card-desc {
    font-size: 0.85rem;
    color: var(--ink-light);
    margin: 0;
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 4px;
  }
  .btn-open, .btn-copy {
    font-family: 'Sarabun', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease;
  }
  .btn-open {
    background: var(--sand);
    color: var(--ink);
    flex: 1;
    text-decoration: none;
    justify-content: center;
  }
  .btn-open:hover { background: var(--orange-soft); }
  .btn-copy {
    background: var(--sand);
    color: var(--ink-light);
    position: relative;
  }
  .btn-copy:hover { background: var(--yellow); color: var(--navy); }
  .btn-copy.copied { background: #DCEFDD; color: #2E7D46; }

  .copy-toast {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--navy);
    color: var(--white);
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .copy-toast.show { opacity: 1; transform: translateY(0); }

  /* ---------- Empty state ---------- */
  .empty-state {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-state img {
    width: 130px;
    object-fit: contain;
  }
  .empty-state p {
    margin: 0;
    color: var(--ink-light);
    font-size: 0.9rem;
    max-width: 320px;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--ink-light);
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    .hero-text h1 { font-size: 1.25rem; }
    .card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- Light access gate: a friendly front door, not real security. Change GATE_PASSWORD below before publishing. -->
  <div id="gate">
    <img src="assets/gate-welcome.png" alt="มาสคอตน้องช้างทางหลวง ยินดีต้อนรับ">
    <h2>ระบบศูนย์รวมช่องทางปฏิบัติงานดิจิทัล</h2>
    <div class="gate-input-wrap">
      <input type="password" id="gate-input" placeholder="ใส่รหัสผ่านเพื่อเข้าใช้งาน" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="toggle-pw" id="toggle-pw" aria-label="แสดง/ซ่อนรหัสผ่าน">
        <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <button id="gate-submit">เข้าสู่ระบบ</button>
    <div id="gate-error"></div>
  </div>

  <div id="app">
    <header class="hero">
      <div class="hero-inner">
        <img class="hero-logo" src="assets/mascot-logo-full.png" alt="มาสคอตน้องช้างทางหลวง">
        <div class="hero-text">
          <h1>ระบบศูนย์รวมช่องทางปฏิบัติงานดิจิทัล</h1>
          <p class="eng-name">Nannaphat Digital Work Portal</p>
          <p>นันท์นภัสธ์ รัตนเสถียร · ผู้ช่วยหมวดทางหลวงเชิงเนิน</p>
        </div>
      </div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search" placeholder="ค้นหาชื่อระบบ...">
      </div>
    </div>

    <main>
      <div class="tabs" id="tabs"></div>
      <div id="categories"></div>
    </main>

    <footer>สร้างและดูแลโดยนันท์นภัสธ์ รัตนเสถียร</footer>
  </div>

<script>
  // ---------- CONFIG: add new sites here, no other code needs to change ----------
  const GATE_PASSWORD = "changeme"; // เปลี่ยนรหัสนี้ก่อนเผยแพร่จริง

  const categories = [
    { id: 'all', name: 'ทั้งหมด' },
    { id: 'section', name: 'งานหมวดทางหลวงเชิงเนิน', dotClass: 'dot-section', cardClass: '' },
    { id: 'personal', name: 'งานคุณนันท์นภัสธ์ รัตนเสถียร', dotClass: 'dot-personal', cardClass: 'accent-personal' },
  ];

  const sites = [
    {
      name: "ระบบติดตามงานอุบัติเหตุ",
      desc: "บันทึกและติดตามอุบัติเหตุบนสายทางในความรับผิดชอบของหมวด",
      url: "https://script.google.com/macros/s/AKfycbzfTgoBclgZ0WVCfNQilgjSuqifh0zxy1mqFgTfweS2CSc0jBTuXG62GrHj1CkEIIg-kw/exec",
      category: "section",
      icon: "🚧"
    },
    {
      name: "ระบบบริหารหมวด",
      desc: "ประตูเข้าสู่งานสารบรรณ สถิติ พัสดุ และการเงินของหมวดทั้งหมด",
      url: "https://saypanswm27.github.io/nannaphat-ChoengNoen/choengnoen0-main.html",
      category: "section",
      icon: "📋"
    }
    // เพิ่มระบบใหม่โดยคัดลอกก้อนนี้ แล้วแก้ name / desc / url / category
  ];

  let activeCategory = 'all';
  let searchTerm = '';

  // ---------- Gate ----------
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const gateInput = document.getElementById('gate-input');
  const gateSubmit = document.getElementById('gate-submit');
  const togglePw = document.getElementById('toggle-pw');
  const eyeIcon = document.getElementById('eye-icon');

  togglePw.addEventListener('click', () => {
    const showing = gateInput.type === 'text';
    gateInput.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>'
      : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.86 19.86 0 0 1 4.22-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  });
  const gateError = document.getElementById('gate-error');

  function tryUnlock() {
    if (gateInput.value.trim() === GATE_PASSWORD) {
      sessionStorage.setItem('hub_unlocked', '1');
      gate.style.display = 'none';
      app.classList.add('visible');
    } else {
      gateError.textContent = 'รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง';
      gateInput.value = '';
      gateInput.focus();
    }
  }
  gateSubmit.addEventListener('click', tryUnlock);
  gateInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  if (sessionStorage.getItem('hub_unlocked') === '1') {
    gate.style.display = 'none';
    app.classList.add('visible');
  } else {
    gateInput.focus();
  }

  // ---------- Render tabs ----------
  const tabsEl = document.getElementById('tabs');
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat.id === activeCategory ? ' active' : '');
    btn.textContent = cat.name;
    btn.dataset.cat = cat.id;
    btn.addEventListener('click', () => {
      activeCategory = cat.id;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat.id));
      render();
    });
    tabsEl.appendChild(btn);
  });

  // ---------- Copy link ----------
  function copyLink(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      const toast = btn.querySelector('.copy-toast');
      btn.classList.add('copied');
      toast.classList.add('show');
      setTimeout(() => {
        btn.classList.remove('copied');
        toast.classList.remove('show');
      }, 1400);
    });
  }

  // ---------- Render cards ----------
  const categoriesEl = document.getElementById('categories');

  function render() {
    categoriesEl.innerHTML = '';
    const realCategories = categories.filter(c => c.id !== 'all');
    const catsToShow = activeCategory === 'all' ? realCategories : realCategories.filter(c => c.id === activeCategory);

    catsToShow.forEach(cat => {
      const filtered = sites.filter(s => s.category === cat.id && s.name.toLowerCase().includes(searchTerm.toLowerCase()));

      const block = document.createElement('div');
      block.className = 'category-block';

      const title = document.createElement('h2');
      title.className = 'category-title';
      title.innerHTML = `<span class="category-dot ${cat.dotClass}"></span>${cat.name}`;
      block.appendChild(title);

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `
          <img src="assets/mascot-empty.png" alt="ยังไม่มีระบบในหมวดนี้">
          <p>${searchTerm ? 'ไม่พบระบบที่ค้นหาในหมวดนี้' : 'ยังไม่มีระบบในหมวดนี้ เพิ่มได้เมื่อพัฒนาเสร็จ'}</p>
        `;
        block.appendChild(empty);
      } else {
        const grid = document.createElement('div');
        grid.className = 'card-grid';
        filtered.forEach(site => {
          const card = document.createElement('div');
          card.className = 'card ' + cat.cardClass;
          card.innerHTML = `
            <div class="card-top">
              <span class="card-icon">${site.icon || '🔗'}</span>
              <div>
                <p class="card-name">${site.name}</p>
                <p class="card-desc">${site.desc || ''}</p>
              </div>
            </div>
            <div class="card-actions">
              <a class="btn-open" href="${site.url}" target="_blank" rel="noopener">เปิดระบบ</a>
              <button class="btn-copy" title="คัดลอกลิงก์">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span class="copy-toast">คัดลอกแล้ว</span>
              </button>
            </div>
          `;
          card.querySelector('.btn-copy').addEventListener('click', (e) => copyLink(site.url, e.currentTarget));
          grid.appendChild(card);
        });
        block.appendChild(grid);
      }

      categoriesEl.appendChild(block);
    });
  }

  document.getElementById('search').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
  });

  render();
</script>
</body>
</html>
