<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ศูนย์ปฏิบัติงานเชิงเนิน | CN-Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-layer.js"></script>
<style>
  :root {
    --navy: #16233F;
    --navy-soft: #223257;
    --orange: #E8722A;
    --orange-soft: #F6D9B8;
    --sand: #FBF3E7;
    --yellow: #FFC94D;
    --ink: #333B4D;
    --ink-light: #6B7285;
    --white: #FFFFFF;
    --radius: 14px;
    --red: #E0342A;
    --red-dark: #B92A22;
    --red-glow: rgba(224, 52, 42, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Kanit', sans-serif;
  }

  /* ---------- Layout ---------- */
  header.hero {
    background: var(--navy);
    color: var(--white);
    padding: 18px 20px;
  }
  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    flex-shrink: 0;
    animation: wave-in 0.7s ease-out;
  }
  @keyframes wave-in {
    0% { transform: translateY(-8px) rotate(-6deg); opacity: 0; }
    60% { transform: translateY(2px) rotate(4deg); opacity: 1; }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .hero-text h1 {
    margin: 0 0 2px;
    font-size: 1.25rem;
    line-height: 1.3;
  }
  .hero-text .eng-name {
    margin: 0;
    color: #8FA0C4;
    font-size: 0.75rem;
    letter-spacing: 0.3px;
  }
  .hero-text p {
    margin: 0;
    color: #C9D2E3;
    font-size: 0.95rem;
  }

  .btn-owner {
    margin-left: auto;
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.1);
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  .btn-owner:hover { background: rgba(255,255,255,0.2); }
  .btn-owner.active { background: var(--orange); border-color: var(--orange); }
  .btn-owner.active:hover { background: #D5651E; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .config-banner {
    background: #FFF3CD;
    color: #664D03;
    border: 1px solid #FFE69C;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 0.9rem;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .config-banner code {
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .tab {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1.5px solid #E3D6C4;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }

  .category-block { margin-bottom: 36px; }
  .category-block:last-child { margin-bottom: 0; }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: 1.1rem;
  }
  .category-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-section { background: var(--navy); }
  .dot-personal { background: var(--orange); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  /* ตัวดันบรรทัด: การ์ดไหนตั้ง rowBreakAfter: true จะมีตัวนี้ต่อท้าย
     กินเต็มความกว้าง 1 บรรทัด (แต่มองไม่เห็น) เพื่อดันการ์ดถัดไปขึ้นบรรทัดใหม่
     ส่วนตัวการ์ดเองยังคงขนาดปกติและชิดซ้าย เพราะไม่ได้ยืดเต็มแถวเอง */
  .card-grid .row-break {
    grid-column: 1 / -1;
    height: 0;
    margin: 0;
    padding: 0;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px;
    border-left: 5px solid var(--navy);
    box-shadow: 0 2px 8px rgba(22,35,63,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.accent-personal { border-left-color: var(--orange); }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(22,35,63,0.12);
  }
  .card:hover .card-icon { transform: rotate(-5deg) scale(1.06); }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .card-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    line-height: 1;
    background: linear-gradient(155deg, var(--sand), var(--orange-soft));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.2s ease;
  }
  .card.accent-personal .card-icon {
    background: linear-gradient(155deg, var(--orange-soft), var(--orange));
  }
  .card-name {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card-desc {
    font-size: 0.85rem;
    color: var(--ink-light);
    margin: 0;
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
    padding-top: 4px;
  }
  .card-actions-icons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-open {
    font-family: 'Sarabun', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 8px;
    border: none;
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: var(--white);
    box-shadow: 0 6px 14px -6px var(--red-glow);
    text-decoration: none;
    justify-content: center;
  }
  .btn-open:hover {
    background: linear-gradient(135deg, var(--red-dark), #8f2018);
    box-shadow: 0 8px 18px -6px var(--red-glow);
    transform: translateY(-1px);
  }

  /* ปุ่มไอคอนกลม/เหลี่ยมเล็กๆ ข้าง "เปิดระบบ" เช่น ปุ่ม Sheets, คัดลอกลิงก์, แก้ไข, ลบ */
  .btn-icon {
    font-family: 'Sarabun', sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    position: relative;
    background: var(--sand);
    color: var(--ink-light);
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-firebase:hover { background: #FFF3CD; color: #F57C00; }
  .btn-github:hover { background: #E7E7E7; color: #24292E; }
  .btn-copy:hover { background: var(--yellow); color: var(--navy); }
  .btn-copy.copied { background: #DCEFDD; color: #2E7D46; }
  .btn-edit:hover { background: #DCEAFB; color: #1D4ED8; }
  .btn-delete:hover { background: #FBDCDC; color: #C0392B; }

  /* ข้อความ tooltip ที่โผล่ขึ้นตอนเอาเมาส์ไปชี้ที่ปุ่มไอคอน */
  .btn-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--navy);
    color: var(--white);
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .btn-icon:hover .btn-tooltip,
  .btn-tooltip.show { opacity: 1; transform: translateY(0); }

  /* ---------- Empty state ---------- */
  .empty-state {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-state p {
    margin: 0;
    color: var(--ink-light);
    font-size: 0.9rem;
    max-width: 320px;
  }

  /* ---------- ปุ่มเพิ่มระบบ (เจ้าของเว็บเท่านั้น) ---------- */
  .btn-add-card {
    border: 1.5px dashed #C9BBA3;
    border-radius: var(--radius);
    background: transparent;
    color: var(--ink-light);
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    min-height: 96px;
    width: 100%;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn-add-card:hover { border-color: var(--orange); color: var(--orange); }

  /* ---------- Modal (ล็อกอินเจ้าของ / เพิ่ม-แก้การ์ด) ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22,35,63,0.55);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: var(--white);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h3 { margin: 0; font-size: 1.15rem; }
  .modal-field label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-light);
    margin-bottom: 4px;
  }
  .modal-field input {
    font-family: 'Sarabun', sans-serif;
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid #E3D6C4;
    width: 100%;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--ink);
  }
  .modal-error {
    color: #C0392B;
    font-size: 0.85rem;
    min-height: 1.1em;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .modal-actions button {
    font-family: 'Kanit', sans-serif;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .btn-primary { background: var(--orange); color: var(--white); }
  .btn-primary:hover { background: #D5651E; }
  .btn-secondary { background: var(--sand); color: var(--ink); }
  .btn-secondary:hover { background: var(--orange-soft); }
  .btn-danger { background: #FBDCDC; color: #C0392B; margin-right: auto; }
  .btn-danger:hover { background: #F6C2C2; }

  @media (max-width: 480px) {
    .hero-text h1 { font-size: 1.25rem; }
    .card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div id="app">
    <header class="hero">
      <div class="hero-inner">
        <img class="hero-logo" src="assets/mascot-logo-badge.png" alt="มาสคอตน้องช้างทางหลวง">
        <div class="hero-text">
          <h1>ศูนย์ปฏิบัติงานเชิงเนิน</h1>
          <p class="eng-name">ChoengNoen Work Center</p>
        </div>
        <button id="btn-owner" class="btn-owner" type="button" title="งานส่วนตัว">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </div>
    </header>

    <main>
      <div id="config-banner" class="config-banner" style="display:none;">
        ยังไม่ได้ตั้งค่า Firebase สำหรับเว็บนี้ — เปิดไฟล์ <code>firebase-layer.js</code> แล้วใส่ค่า <code>firebaseConfig</code> จาก Firebase Console ของโปรเจกต์ที่สร้างไว้ (ดูขั้นตอนใน <code>คู่มือติดตั้ง-อ่านก่อน.md</code>)
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="categories"></div>
    </main>
  </div>

  <div id="modal-root"></div>

<script>
  // ---------- CATEGORY CONFIG ----------
  const CATS = {
    section: { name: 'งานหมวดทางหลวงเชิงเนิน', dotClass: 'dot-section', cardClass: '', col: 'sites_public' },
    personal: { name: 'งานคุณนันท์นภัสธ์ รัตนเสถียร', dotClass: 'dot-personal', cardClass: 'accent-personal', col: 'sites_private' }
  };

  let isOwner = false;
  let hasOwnerAccount = null; // null = ยังไม่เช็ค, true/false หลังเช็คแล้ว
  let activeCategory = 'all';

  const tabsEl = document.getElementById('tabs');
  const categoriesEl = document.getElementById('categories');
  const modalRoot = document.getElementById('modal-root');
  const btnOwner = document.getElementById('btn-owner');
  const configBanner = document.getElementById('config-banner');

  /* ---------- ปุ่มงานส่วนตัว / เจ้าของเว็บ ---------- */
  btnOwner.addEventListener('click', async function () {
    if (isOwner) {
      await FBL.logout();
      return;
    }
    openAuthModal();
  });

  function setOwnerState(owner) {
    isOwner = owner;
    btnOwner.classList.toggle('active', owner);
    btnOwner.title = owner ? 'ออกจากงานส่วนตัว' : 'งานส่วนตัว';
    if (activeCategory === 'personal' && !owner) activeCategory = 'all';
    if (owner) {
      FBL.watch('sites_private', function () { renderCategories(); }).then(renderAll);
    } else {
      FBL.stop && FBL.stop('sites_private');
      renderAll();
    }
  }

  /* ---------- Modal: ล็อกอิน / ตั้งรหัสผ่านเจ้าของครั้งแรก ---------- */
  function closeModal() { modalRoot.innerHTML = ''; }

  async function openAuthModal() {
    if (hasOwnerAccount === null) {
      try { hasOwnerAccount = await FBL.hasOwner(); } catch (e) { hasOwnerAccount = false; }
    }
    const isBootstrap = !hasOwnerAccount;
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="auth-overlay">
        <div class="modal-box">
          <h3>${isBootstrap ? 'ตั้ง ID และรหัสผ่านเจ้าของเว็บ (ครั้งแรก)' : 'เข้าสู่ระบบเจ้าของเว็บ'}</h3>
          <div class="modal-field">
            <label>ID</label>
            <input type="text" id="auth-id" autocomplete="off">
          </div>
          <div class="modal-field">
            <label>รหัสผ่าน${isBootstrap ? ' (อย่างน้อย 6 ตัวอักษร)' : ''}</label>
            <input type="password" id="auth-pw" autocomplete="off">
          </div>
          ${isBootstrap ? `
          <div class="modal-field">
            <label>ยืนยันรหัสผ่านอีกครั้ง</label>
            <input type="password" id="auth-pw2" autocomplete="off">
          </div>` : ''}
          <div class="modal-error" id="auth-error"></div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="auth-cancel">ยกเลิก</button>
            <button type="button" class="btn-primary" id="auth-submit">${isBootstrap ? 'ตั้งรหัสผ่าน' : 'เข้าสู่ระบบ'}</button>
          </div>
        </div>
      </div>`;
    const idInput = document.getElementById('auth-id');
    const pwInput = document.getElementById('auth-pw');
    const errorEl = document.getElementById('auth-error');
    document.getElementById('auth-cancel').addEventListener('click', closeModal);
    document.getElementById('auth-overlay').addEventListener('click', function (e) { if (e.target.id === 'auth-overlay') closeModal(); });

    async function submit() {
      errorEl.textContent = '';
      const id = idInput.value.trim();
      const pw = pwInput.value;
      if (!id) { errorEl.textContent = 'กรอก ID'; return; }
      try {
        if (isBootstrap) {
          const pw2 = document.getElementById('auth-pw2').value;
          if (pw.length < 6) { errorEl.textContent = 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร'; return; }
          if (pw !== pw2) { errorEl.textContent = 'รหัสผ่านสองช่องไม่ตรงกัน'; return; }
          await FBL.bootstrapOwner(id, pw);
          hasOwnerAccount = true;
        } else {
          await FBL.login(id, pw);
        }
        closeModal();
      } catch (e) {
        errorEl.textContent = e.message || 'เกิดข้อผิดพลาด';
      }
    }
    document.getElementById('auth-submit').addEventListener('click', submit);
    idInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') pwInput.focus(); });
    pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    idInput.focus();
  }

  /* ---------- Modal: เพิ่ม / แก้ไข การ์ดระบบ ---------- */
  function openSiteModal(catId, site) {
    const isEdit = !!site;
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="site-overlay">
        <div class="modal-box">
          <h3>${isEdit ? 'แก้ไขระบบ' : 'เพิ่มระบบใหม่'}</h3>
          <div class="modal-field"><label>ชื่อระบบ *</label><input type="text" id="site-name" value="${site ? escapeAttr(site.name) : ''}"></div>
          <div class="modal-field"><label>คำอธิบายสั้นๆ</label><input type="text" id="site-desc" value="${site ? escapeAttr(site.desc || '') : ''}"></div>
          <div class="modal-field"><label>ลิงก์เปิดระบบ *</label><input type="text" id="site-url" value="${site ? escapeAttr(site.url || '') : ''}" placeholder="https://..."></div>
          <div class="modal-field"><label>ลิงก์ Firebase (ถ้ามี)</label><input type="text" id="site-firebase" value="${site ? escapeAttr(site.firebaseUrl || '') : ''}" placeholder="https://console.firebase.google.com/..."></div>
          <div class="modal-field"><label>ลิงก์ Github (ถ้ามี)</label><input type="text" id="site-github" value="${site ? escapeAttr(site.githubUrl || '') : ''}" placeholder="https://github.com/..."></div>
          <div class="modal-field"><label>ไอคอน (emoji)</label><input type="text" id="site-icon" value="${site ? escapeAttr(site.icon || '') : '🔗'}" maxlength="4"></div>
          <label class="checkbox-row"><input type="checkbox" id="site-rowbreak" ${site && site.rowBreakAfter ? 'checked' : ''}> ขึ้นบรรทัดใหม่หลังการ์ดนี้</label>
          <div class="modal-error" id="site-error"></div>
          <div class="modal-actions">
            ${isEdit ? '<button type="button" class="btn-danger" id="site-delete">ลบระบบนี้</button>' : ''}
            <button type="button" class="btn-secondary" id="site-cancel">ยกเลิก</button>
            <button type="button" class="btn-primary" id="site-submit">บันทึก</button>
          </div>
        </div>
      </div>`;
    const errorEl = document.getElementById('site-error');
    document.getElementById('site-cancel').addEventListener('click', closeModal);
    document.getElementById('site-overlay').addEventListener('click', function (e) { if (e.target.id === 'site-overlay') closeModal(); });
    if (isEdit) {
      document.getElementById('site-delete').addEventListener('click', async function () {
        if (!confirm('ลบระบบ "' + site.name + '" ออกจากรายการ?')) return;
        try { await FBL.deleteSite(CATS[catId].col, site.__id); closeModal(); }
        catch (e) { errorEl.textContent = e.message || 'ลบไม่สำเร็จ'; }
      });
    }
    document.getElementById('site-submit').addEventListener('click', async function () {
      const name = document.getElementById('site-name').value.trim();
      const url = document.getElementById('site-url').value.trim();
      if (!name || !url) { errorEl.textContent = 'กรอกชื่อระบบและลิงก์เปิดระบบให้ครบ'; return; }
      const payload = {
        __id: site ? site.__id : undefined,
        order: site ? site.order : undefined,
        name: name,
        desc: document.getElementById('site-desc').value.trim(),
        url: url,
        firebaseUrl: document.getElementById('site-firebase').value.trim(),
        githubUrl: document.getElementById('site-github').value.trim(),
        icon: document.getElementById('site-icon').value.trim(),
        rowBreakAfter: document.getElementById('site-rowbreak').checked
      };
      try { await FBL.saveSite(CATS[catId].col, payload); closeModal(); }
      catch (e) { errorEl.textContent = e.message || 'บันทึกไม่สำเร็จ'; }
    });
  }

  function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  /* ---------- Copy link ---------- */
  function copyLink(url, btn) {
    navigator.clipboard.writeText(url).then(function () {
      const toast = btn.querySelector('.btn-tooltip');
      const originalText = toast.textContent;
      btn.classList.add('copied');
      toast.textContent = 'คัดลอกแล้ว';
      toast.classList.add('show');
      setTimeout(function () {
        btn.classList.remove('copied');
        toast.textContent = originalText;
        toast.classList.remove('show');
      }, 1400);
    });
  }

  /* ---------- Render tabs ---------- */
  function renderTabs() {
    tabsEl.innerHTML = '';
    const ids = ['all', 'section'].concat(isOwner ? ['personal'] : []);
    ids.forEach(function (id) {
      const label = id === 'all' ? 'ทั้งหมด' : CATS[id].name;
      const btn = document.createElement('button');
      btn.className = 'tab' + (id === activeCategory ? ' active' : '');
      btn.textContent = label;
      btn.dataset.cat = id;
      btn.addEventListener('click', function () {
        activeCategory = id;
        renderTabs();
        renderCategories();
      });
      tabsEl.appendChild(btn);
    });
  }

  /* ---------- Render cards ---------- */
  function renderCategories() {
    categoriesEl.innerHTML = '';
    const allIds = ['section'].concat(isOwner ? ['personal'] : []);
    const catsToShow = activeCategory === 'all' ? allIds : allIds.filter(function (id) { return id === activeCategory; });

    catsToShow.forEach(function (catId) {
      const cat = CATS[catId];
      const filtered = FBL.docs(cat.col);

      const block = document.createElement('div');
      block.className = 'category-block';

      const title = document.createElement('h2');
      title.className = 'category-title';
      title.innerHTML = '<span class="category-dot ' + cat.dotClass + '"></span>' + cat.name;
      block.appendChild(title);

      if (filtered.length === 0 && !isOwner) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<p>ยังไม่มีระบบในหมวดนี้</p>';
        block.appendChild(empty);
      } else {
        const grid = document.createElement('div');
        grid.className = 'card-grid';
        filtered.forEach(function (site) {
          const card = document.createElement('div');
          card.className = 'card ' + cat.cardClass;
          card.innerHTML =
            '<div class="card-top">' +
              '<span class="card-icon">' + (site.icon || '🔗') + '</span>' +
              '<div>' +
                '<p class="card-name">' + escapeAttr(site.name) + '</p>' +
                '<p class="card-desc">' + escapeAttr(site.desc || '') + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="card-actions">' +
              '<a class="btn-open" href="' + escapeAttr(site.url) + '" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9 8l4 4-4 4"></path></svg>เปิดระบบ</a>' +
              '<div class="card-actions-icons">' +
                (isOwner && site.firebaseUrl ? '<a class="btn-icon btn-firebase" href="' + escapeAttr(site.firebaseUrl) + '" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg><span class="btn-tooltip">เปิด Firebase</span></a>' : '') +
                (isOwner && site.githubUrl ? '<a class="btn-icon btn-github" href="' + escapeAttr(site.githubUrl) + '" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"></path></svg><span class="btn-tooltip">เปิด Github</span></a>' : '') +
                '<button class="btn-icon btn-copy" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="btn-tooltip">คัดลอกลิงก์</span></button>' +
                (isOwner ? '<button class="btn-icon btn-edit" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg><span class="btn-tooltip">แก้ไข</span></button>' : '') +
              '</div>' +
            '</div>';
          card.querySelector('.btn-copy').addEventListener('click', function (e) { copyLink(site.url, e.currentTarget); });
          if (isOwner) card.querySelector('.btn-edit').addEventListener('click', function () { openSiteModal(catId, site); });
          grid.appendChild(card);
          if (site.rowBreakAfter) {
            const rowBreak = document.createElement('div');
            rowBreak.className = 'row-break';
            grid.appendChild(rowBreak);
          }
        });
        if (isOwner) {
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'btn-add-card';
          addBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> เพิ่มระบบ';
          addBtn.addEventListener('click', function () { openSiteModal(catId, null); });
          grid.appendChild(addBtn);
        }
        block.appendChild(grid);
      }

      categoriesEl.appendChild(block);
    });
  }

  function renderAll() { renderTabs(); renderCategories(); }

  /* ---------- เริ่มระบบ ---------- */
  if (!window.FBL || !FBL.configured) {
    configBanner.style.display = 'block';
  } else {
    FBL.onError = function (msg) { console.error(msg); };
    FBL.onAuth(function (owner) { setOwnerState(owner); });
    FBL.watch('sites_public', function () { renderCategories(); }).then(renderAll);
  }
</script>
</body>
</html>
