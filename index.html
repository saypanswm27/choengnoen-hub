<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ศูนย์ข้อมูลดิจิทัล หมวดทางหลวงเชิงเนิน | CN-Hub</title>
<!-- ชื่อ/คำอธิบายตอนแชร์ลิงก์ (LINE, Facebook ฯลฯ) — ตัวดึงพรีวิวไม่รัน JavaScript จึงต้องเขียนไว้ตรงนี้ -->
<meta name="description" content="Digital Highway Data Center — ศูนย์รวบรวมข้อมูลสำคัญ หมวดทางหลวงเชิงเนิน">
<meta property="og:type" content="website">
<meta property="og:url" content="https://choengnoen.github.io/choengnoen-hub/">
<meta property="og:site_name" content="CN-Hub">
<meta property="og:title" content="ศูนย์ข้อมูลดิจิทัล หมวดทางหลวงเชิงเนิน">
<meta property="og:description" content="Digital Highway Data Center — ศูนย์รวบรวมข้อมูลสำคัญ หมวดทางหลวงเชิงเนิน">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-layer.js"></script>
<style>
  :root {
    --navy: #16233F;
    --navy-soft: #223257;
    --orange: #E8722A;
    --orange-soft: #F6D9B8;
    --sand: #F4F6F9;
    --yellow: #FFC94D;
    --ink: #333B4D;
    --ink-light: #6B7285;
    --white: #FFFFFF;
    --radius: 14px;
    --red: #E0342A;
    --red-dark: #B92A22;
    --red-glow: rgba(224, 52, 42, 0.4);
    --blue-top: #0B3472;
    --blue-bottom: #1464B4;
    --blue-glow: rgba(16, 80, 160, 0.45);
    --line: #DDE3EB;
    --paper-2: #EDF1F6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Kanit', sans-serif;
  }

  /* ---------- Layout ---------- */
  header.hero {
    /* ใส่รูปท้องฟ้า: แก้ none เป็น url('assets/ชื่อไฟล์.jpg') */
    --hero-bg-image: none;
    --hero-bg-pos: 50% 50%;
    background:
      var(--hero-bg-image) var(--hero-bg-pos) / cover no-repeat,
      linear-gradient(180deg, #5B9BD5 0%, #8DBCE6 55%, #C7E0F4 100%);
    color: #0A2A4F;
    padding: 40px 20px;
  }
  .hero-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    flex-shrink: 0;
    /* เงาสีขาวรอบวงกลม (drop-shadow ตามรูปทรงจริงของรูป ไม่ใช่กรอบสี่เหลี่ยม) */
    filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
    animation: wave-in 0.7s ease-out;
  }
  @keyframes wave-in {
    0% { transform: translateY(-8px) rotate(-6deg); opacity: 0; }
    60% { transform: translateY(2px) rotate(4deg); opacity: 1; }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .hero-text h1 {
    margin: 0;
    font-family: 'Kanit', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: #0A2A4F;
    /* เงาขาวรอบตัวอักษร ให้อ่านชัดเมื่อมีรูปพื้นหลัง */
    text-shadow:
      0 0 2px #fff, 0 0 4px #fff, 0 0 10px rgba(255,255,255,0.9),
      1px 2px 3px rgba(255,255,255,0.8);
  }
  .hero-text .eng-name {
    margin: 0;
    font-family: 'Kanit', sans-serif;
    font-weight: 400;
    color: #0B0B0B;
    font-size: 1.1rem;
    line-height: 1.3;
    letter-spacing: 0.4px;
    text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 8px rgba(255,255,255,0.9);
  }
  .hero-text p {
    margin: 0;
    color: #C9D2E3;
    font-size: 0.95rem;
  }

  .hero-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .btn-owner {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.55);
    color: #0A2A4F;
    border: 1px solid rgba(10,42,79,0.25);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
    flex-shrink: 0;
  }
  .btn-owner:hover { background: rgba(255,255,255,0.8); }
  .btn-owner.active { background: var(--orange); border-color: var(--orange); color: var(--white); }
  .btn-owner.active:hover { background: #D5651E; }

  /* ---------- เมนูผู้จัดการ (ปุ่ม ☰ สีส้ม) ---------- */
  .owner-menu-wrap { position: relative; }
  .owner-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 100;
    width: 270px;
    max-width: calc(100vw - 32px);
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 18px 44px -12px rgba(10,26,48,0.35);
    padding: 6px;
    animation: menuPop 0.14s ease-out;
  }
  .owner-menu[hidden] { display: none; }
  @keyframes menuPop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .menu-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-light);
    padding: 8px 10px 4px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
  }
  .menu-item svg { flex-shrink: 0; color: var(--ink-light); }
  .menu-item:hover, .menu-item:focus-visible { background: var(--paper-2); outline: none; }
  .menu-item:hover svg { color: var(--blue-bottom); }
  .menu-item span { display: flex; flex-direction: column; min-width: 0; }
  .menu-item small { font-size: 0.75rem; color: var(--ink-light); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
  .menu-danger, .menu-danger svg { color: #C0392B; }
  .menu-danger:hover { background: #FBE3E1; }
  .menu-danger:hover svg { color: #C0392B; }

  /* ตัวอย่างหัวเว็บ: สัดส่วนกว้าง:สูงเท่าหัวเว็บจริง (ตั้งใน JS) + cover แบบเดียวกัน
     ตำแหน่งที่เห็นจึงตรงกับที่แสดงจริง — ใช้ box-shadow แทน border เพื่อไม่ให้พื้นที่รูปเพี้ยน */
  .hero-preview {
    height: 120px;
    border-radius: 12px;
    background: linear-gradient(180deg, #5B9BD5 0%, #8DBCE6 55%, #C7E0F4 100%);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin-bottom: 10px;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .hero-preview.can-drag { cursor: grab; touch-action: none; user-select: none; }
  .hero-preview.dragging { cursor: grabbing; }
  .preview-label { font-size: 0.8rem; color: var(--ink-light); margin: 0 0 4px; }
  .pos-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.85rem; color: var(--ink-light); }
  .pos-row[hidden] { display: none; }
  .btn-pos {
    padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); cursor: pointer;
    font-family: 'Sarabun', sans-serif; font-size: 0.85rem;
  }
  .btn-pos:hover { border-color: var(--orange); color: var(--orange); }
  .hero-hint { font-size: 0.8rem; color: var(--ink-light); margin: 8px 0 0; line-height: 1.5; }
  .logo-row {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, #F4F7FB, #FFFFFF);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .swatch-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--white); box-shadow: 0 0 0 1px var(--line);
    cursor: pointer; padding: 0; position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.9rem; transition: transform 0.12s ease;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.selected { box-shadow: 0 0 0 2px var(--ink); }
  .swatch-default {
    width: auto; border-radius: 15px; padding: 0 12px;
    background: var(--paper-2); color: var(--ink); font-family: inherit; font-size: 0.8rem;
  }
  .swatch-custom { background: var(--white); overflow: hidden; }
  .swatch-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .logo-preview { width: 60px; height: 60px; object-fit: contain; flex-shrink: 0; }
  .logo-row-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .upload-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn-link {
    background: none; border: none; padding: 0;
    color: var(--ink-light); font-size: 0.8rem; text-decoration: underline; cursor: pointer;
    font-family: 'Sarabun', sans-serif;
  }
  .btn-link:hover { color: var(--orange); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .config-banner {
    background: #FFF3CD;
    color: #664D03;
    border: 1px solid #FFE69C;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 0.9rem;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .config-banner code {
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .tab {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1.5px solid #E3D6C4;
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }

  .category-block { margin-bottom: 36px; }
  .category-block:last-child { margin-bottom: 0; }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: 1.1rem;
  }
  .category-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-section { background: var(--navy); }
  .dot-personal { background: var(--orange); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  /* ตัวดันบรรทัด: การ์ดไหนตั้ง rowBreakAfter: true จะมีตัวนี้ต่อท้าย
     กินเต็มความกว้าง 1 บรรทัด (แต่มองไม่เห็น) เพื่อดันการ์ดถัดไปขึ้นบรรทัดใหม่
     ส่วนตัวการ์ดเองยังคงขนาดปกติและชิดซ้าย เพราะไม่ได้ยืดเต็มแถวเอง */
  .card-grid .row-break {
    grid-column: 1 / -1;
    height: 0;
    margin: 0;
    padding: 0;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px;
    --card-accent: var(--navy);
    border-left: 5px solid var(--card-accent);
    box-shadow: 0 2px 8px rgba(22,35,63,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.accent-personal { --card-accent: var(--orange); }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(22,35,63,0.12);
  }
  .card:hover .card-icon { transform: rotate(-5deg) scale(1.06); }

  /* ที่จับสำหรับลากย้ายการ์ด (เห็นเฉพาะผู้จัดการ) — ต้องกดที่นี่เท่านั้นถึงจะลากได้ */
  .card { position: relative; }
  .drag-handle {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #A7AEBD;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .drag-handle:hover { background: var(--sand); color: var(--ink); }
  .card.has-handle .card-top { padding-right: 26px; }
  /* การ์ดที่กำลังลาก: ลอยตามนิ้ว/เมาส์ ไม่มีแอนิเมชันหน่วง */
  .card.dragging {
    z-index: 50;
    transition: none;
    box-shadow: 0 18px 40px rgba(22,35,63,0.28);
    opacity: 0.95;
    pointer-events: none;
  }
  .card.dragging .drag-handle { cursor: grabbing; }
  body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
  body.is-dragging .card:not(.dragging) { transform: none; }

  /* ปุ่มจัดลำดับ / บันทึก / ยกเลิก ข้างชื่อหมวด */
  .arrange-bar { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .arrange-hint { font-family: 'Sarabun', sans-serif; font-weight: 400; font-size: 0.8rem; color: var(--ink-light); margin-right: 4px; }
  .btn-arrange {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s ease, color 0.15s ease, filter 0.15s ease;
  }
  .btn-arrange:hover { border-color: var(--blue-bottom); color: var(--blue-bottom); }
  .btn-arrange.btn-primary { border-color: transparent; color: var(--white); }
  .btn-arrange.btn-primary:hover { color: var(--white); }
  .btn-arrange:disabled { opacity: 0.7; cursor: default; }
  /* ระหว่างจัดลำดับ: ซ่อนปุ่มในการ์ด เหลือแค่ที่จับ จะได้ไม่เผลอกดแก้ไข */
  .card-grid.arranging .card { outline: 1.5px dashed #B8C4D6; outline-offset: 2px; }
  .card-grid.locked .card-actions-icons { display: none; }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .card-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    line-height: 1;
    box-sizing: border-box;
    background: var(--white);
    border: 2px solid var(--card-accent);
    transition: transform 0.2s ease;
  }
  .card-name {
    font-family: 'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card-desc {
    font-size: 0.85rem;
    color: var(--ink-light);
    margin: 0;
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
    padding-top: 4px;
  }
  /* แถวบน: ปุ่ม "เปิดระบบ" + ปุ่มคัดลอกลิงก์อยู่ด้านขวา */
  .card-actions-main {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .card-actions-main .btn-open { flex: 1; min-width: 0; justify-content: center; }
  .card-actions-main .btn-icon { height: auto; min-height: 38px; }
  .card-actions-icons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-actions-icons:empty { display: none; }
  .btn-open {
    font-family: 'Sarabun', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 8px;
    border: none;
    padding: 9px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    /* น้ำเงินไล่เฉดแบบแถบเมนูเว็บกรมทางหลวง: เข้มด้านบน สว่างด้านล่าง */
    background: linear-gradient(180deg, var(--blue-top), var(--blue-bottom));
    color: var(--white);
    box-shadow: 0 6px 14px -6px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,0.12);
    text-decoration: none;
    justify-content: center;
  }
  .btn-open:hover {
    background: linear-gradient(180deg, #082A5E, #0D52A0);
    box-shadow: 0 8px 18px -6px var(--blue-glow), inset 0 1px 0 rgba(255,255,255,0.12);
    transform: translateY(-1px);
  }

  /* ปุ่มไอคอนกลม/เหลี่ยมเล็กๆ ข้าง "เปิดระบบ" เช่น ปุ่ม Sheets, คัดลอกลิงก์, แก้ไข, ลบ */
  .btn-icon {
    font-family: 'Sarabun', sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    position: relative;
    background: var(--sand);
    color: var(--ink-light);
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-firebase:hover { background: #FFF3CD; color: #F57C00; }
  .btn-github:hover { background: #E7E7E7; color: #24292E; }
  .btn-copy:hover { background: var(--yellow); color: var(--navy); }
  .btn-copy.copied { background: #DCEFDD; color: #2E7D46; }
  .btn-edit { color: #C0392B; }
  .btn-edit:hover { background: #FBDCDC; color: #A93226; }
  .btn-delete:hover { background: #FBDCDC; color: #C0392B; }

  /* ข้อความ tooltip ที่โผล่ขึ้นตอนเอาเมาส์ไปชี้ที่ปุ่มไอคอน */
  .btn-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--navy);
    color: var(--white);
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .btn-icon:hover .btn-tooltip,
  .btn-tooltip.show { opacity: 1; transform: translateY(0); }

  /* ---------- Empty state ---------- */
  .empty-state {
    background: var(--white);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-state p {
    margin: 0;
    color: var(--ink-light);
    font-size: 0.9rem;
    max-width: 320px;
  }

  /* ---------- ปุ่มเพิ่มระบบ (เจ้าของเว็บเท่านั้น) ---------- */
  .btn-add-card {
    border: 1.5px dashed #C9BBA3;
    border-radius: var(--radius);

  /* ---------- Modal (ล็อกอินเจ้าของ / เพิ่ม-แก้การ์ด / ตั้งค่าหัวเว็บ) ----------
     โครง: ส่วนหัว (ป้าย + ชื่อ + ปุ่ม ×) และแถบปุ่มด้านล่าง ตรึงอยู่กับที่
     เฉพาะเนื้อหา (.modal-body) เลื่อนได้ — แถบเลื่อนจึงไม่พาดทับหัวและมุมโค้งของกล่อง */
  .modal-overlay {

<script>
  // ---------- CATEGORY CONFIG ----------
  const CATS = {
    section: { name: 'งานหมวดทางหลวงเชิงเนิน', dotClass: 'dot-section', cardClass: '', col: 'sites_public' },
    personal: { name: 'งานคุณนันท์นภัสธ์ รัตนเสถียร', dotClass: 'dot-personal', cardClass: 'accent-personal', col: 'sites_private' }
  };

  let isOwner = false;
  let hasOwnerAccount = null; // null = ยังไม่เช็ค, true/false หลังเช็คแล้ว
  let activeCategory = 'all';

  const tabsEl = document.getElementById('tabs');
  const categoriesEl = document.getElementById('categories');
  const modalRoot = document.getElementById('modal-root');
  const btnOwner = document.getElementById('btn-owner');
  const configBanner = document.getElementById('config-banner');
  const heroEl = document.querySelector('header.hero');

  /* ---------- ตั้งค่าหัวเว็บ: รูปพื้นหลัง, รูปโปรไฟล์, ชื่อเว็บ, ชื่อรอง ---------- */
  // ค่าเริ่มต้น (ใช้เมื่อยังไม่ได้ตั้งค่า)
  const HERO_DEFAULTS = {
    image: '',
    logo: 'assets/mascot-logo-badge.png',
    title: 'ศูนย์ข้อมูลดิจิทัล หมวดทางหลวงเชิงเนิน',
    subtitle: 'Digital Highway Data Center'
  };
  // เก็บสำเนาไว้ในเครื่อง เพื่อให้หัวเว็บขึ้นทันทีตอนเปิดเว็บ ไม่ต้องรอโหลดจาก Firebase
  const HERO_CACHE_KEY = 'cnhub.heroSettings';
  let hero = { image: '', imagePos: '', logo: '', title: '', subtitle: '' };
  // ตำแหน่งรูปพื้นหลัง เก็บเป็น "X% Y%" (เช่น "50% 30%") — ค่าว่าง = ตรงกลาง
  function parsePos(s) {
    const m = /^(\d{1,3}(?:\.\d+)?)% (\d{1,3}(?:\.\d+)?)%$/.exec(s || '');
    return m ? { x: Math.min(100, +m[1]), y: Math.min(100, +m[2]) } : { x: 50, y: 50 };
  }
  function fmtPos(p) { return Math.round(p.x) + '% ' + Math.round(p.y) + '%'; }
  const heroLogoEl = document.getElementById('hero-logo');
  const heroTitleEl = document.getElementById('hero-title');
  const heroSubtitleEl = document.getElementById('hero-subtitle');
  const faviconEl = document.querySelector('link[rel="icon"]');

  function applyHero(data) {
    data = data || {};
    hero = { image: data.image || '', imagePos: data.imagePos || '', logo: data.logo || '', title: data.title || '', subtitle: data.subtitle || '' };
    if (hero.image) heroEl.style.setProperty('--hero-bg-image', 'url("' + hero.image + '")');
    else heroEl.style.removeProperty('--hero-bg-image');
    heroEl.style.setProperty('--hero-bg-pos', fmtPos(parsePos(hero.imagePos)));
    heroLogoEl.src = hero.logo || HERO_DEFAULTS.logo;
    if (faviconEl && hero.logo) faviconEl.href = hero.logo;
    heroTitleEl.textContent = hero.title || HERO_DEFAULTS.title;
    heroSubtitleEl.textContent = hero.subtitle || HERO_DEFAULTS.subtitle;
    document.title = (hero.title || HERO_DEFAULTS.title) + ' | CN-Hub';
    try { localStorage.setItem(HERO_CACHE_KEY, JSON.stringify(hero)); }
    catch (e) { /* เบราว์เซอร์ไม่ให้เก็บ — ไม่เป็นไร */ }
  }
  try {
    const cached = localStorage.getItem(HERO_CACHE_KEY);
    if (cached) applyHero(JSON.parse(cached));
  } catch (e) { /* ไม่มีแคช */ }

  // เตรียมรูปก่อนบันทึก — ใช้ไฟล์ต้นฉบับตามเดิม (ไม่ย่อ ไม่บีบอัด)
  // ยกเว้นไฟล์ใหญ่เกินที่ฐานข้อมูลเก็บได้ (Firestore จำกัด 1MB ต่อเอกสาร รวมทุกรูป)
  // จึงค่อยบีบอัดเท่าที่จำเป็น โดยคงความละเอียดเดิมไว้ก่อน แล้วค่อยลดขนาดเป็นทางเลือกสุดท้าย
  //  - รูปพื้นหลัง: ไม่เกิน ~780KB
  //  - รูปโปรไฟล์: ไม่เกิน ~200KB เก็บพื้นใสไว้ (PNG/WebP)
  function readAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      const fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(new Error('เปิดไฟล์รูปนี้ไม่ได้')); };
      fr.readAsDataURL(file);
    });
  }
  async function compressImage(file, opts) {
    const original = await readAsDataURL(file);
    if (original.length < opts.maxBytes && /^data:image\//.test(original)) return original;
    return new Promise(function (resolve, reject) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        let scale = 1;
        let quality = 0.95;
        const canvas = document.createElement('canvas');
        for (let i = 0; i < 16; i++) {
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          let data;
          if (opts.keepAlpha) {
            data = canvas.toDataURL('image/png');
            if (data.length >= opts.maxBytes) data = canvas.toDataURL('image/webp', quality);
          } else {
            data = canvas.toDataURL('image/jpeg', quality);
          }
          if (data.length < opts.maxBytes) { resolve(data); return; }
          if (quality > 0.76) quality -= 0.05; else scale *= 0.85;
        }
        reject(new Error('รูปใหญ่เกินไป ลองใช้รูปอื่น'));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('เปิดไฟล์รูปนี้ไม่ได้')); };
      img.src = url;
    });
  }

  function openHeroModal() {
    const draft = Object.assign({}, hero);
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="hero-overlay">

            <button type="button" class="modal-close" data-close title="ปิด">×</button>
          </div>
          <div class="modal-body">
            <div class="modal-sec"><span class="modal-num">1</span> รูปโปรไฟล์เว็บ</div>
            <div class="logo-row">
              <img class="logo-preview" id="logo-preview" alt="">
              <div class="logo-row-actions">
                <label class="btn-upload">📷 เลือกรูปใหม่<input type="file" id="logo-file" accept="image/*"></label>              </div>
            </div>

            <div class="modal-sec"><span class="modal-num">2</span> ชื่อเว็บ</div>
            <div class="modal-field"><label>ชื่อเว็บ</label><input type="text" id="hero-title-input" maxlength="100"></div>
            <div class="modal-field"><label>ชื่อรองเว็บ</label><input type="text" id="hero-subtitle-input" maxlength="150"></div>

            <div class="modal-sec"><span class="modal-num">3</span> รูปพื้นหลังหัวเว็บ</div>
            <div class="modal-field">
              <div class="preview-label">ตัวอย่างหัวเว็บ (แสดงตรงกับหัวเว็บจริง)</div>
              <div class="hero-preview" id="hero-preview"></div>
              <div class="pos-row" id="pos-row">
                <span>ลากรูปในแถบด้านบน หรือกด:</span>
                <button type="button" class="btn-pos" data-pos-y="0">ชิดบน</button>
                <button type="button" class="btn-pos" data-pos-y="50">กลาง</button>
                <button type="button" class="btn-pos" data-pos-y="100">ชิดล่าง</button>
              </div>
              <div class="upload-row">
                <label class="btn-upload">🖼️ เลือกรูปพื้นหลัง<input type="file" id="hero-file" accept="image/*"></label>              </div>
            </div>

            <div class="modal-error" id="hero-error"></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="hero-cancel">ยกเลิก</button>
            <button type="button" class="btn-primary" id="hero-submit">บันทึก</button>
          </div>
        </div>
      </div>`;
    const previewEl = document.getElementById('hero-preview');
    const logoPreviewEl = document.getElementById('logo-preview');
    const titleInput = document.getElementById('hero-title-input');
    const subtitleInput = document.getElementById('hero-subtitle-input');
    const errorEl = document.getElementById('hero-error');
    const submitBtn = document.getElementById('hero-submit');
    const posRowEl = document.getElementById('pos-row');
    // ให้แถบตัวอย่างมีสัดส่วนกว้าง:สูงเท่าหัวเว็บจริงบนจอนี้พอดี (ไม่ปัดค่า)
    // เพราะ cover + ตำแหน่งแบบ % ขึ้นกับสัดส่วนเท่านั้น ส่วนที่เห็นจึงตรงกับหัวเว็บจริง
    previewEl.style.height = (previewEl.clientWidth * heroEl.offsetHeight / heroEl.offsetWidth) + 'px';
    let pos = parsePos(draft.imagePos);
    let imgSize = null; // ขนาดจริงของรูปพื้นหลัง ใช้คำนวณระยะลาก
    function showPos() { previewEl.style.backgroundPosition = fmtPos(pos); }
    function showBg() {
      previewEl.style.backgroundImage = draft.image ? 'url("' + draft.image + '")' : '';
      previewEl.classList.toggle('can-drag', !!draft.image);
      posRowEl.hidden = !draft.image;
      imgSize = null;
      if (draft.image) {
        const probe = new Image();
        probe.onload = function () { imgSize = { w: probe.naturalWidth, h: probe.naturalHeight }; };
        probe.src = draft.image;
      }
      showPos();
    }
    function showLogo() { logoPreviewEl.src = draft.logo || HERO_DEFAULTS.logo; }

    // ลากรูปในแถบตัวอย่างเพื่อเลื่อนส่วนที่แสดง (รูปขยับตามนิ้ว/เมาส์)
    // ส่วนเกินของรูป (extra) = ขนาดรูปหลัง cover − ขนาดแถบ; ตำแหน่ง 0–100% คือเลื่อนส่วนเกินนี้
    let drag = null;
    const clamp = function (v) { return Math.max(0, Math.min(100, v)); };
    previewEl.addEventListener('pointerdown', function (e) {
      if (!draft.image || !imgSize) return;
      const bw = previewEl.clientWidth, bh = previewEl.clientHeight;
      const s = Math.max(bw / imgSize.w, bh / imgSize.h);
      drag = { x0: e.clientX, y0: e.clientY, p0: { x: pos.x, y: pos.y },
               extraW: imgSize.w * s - bw, extraH: imgSize.h * s - bh };
      try { previewEl.setPointerCapture(e.pointerId); } catch (err) { /* ไม่เป็นไร */ }
      previewEl.classList.add('dragging');
    });
    previewEl.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (drag.extraW > 0.5) pos.x = clamp(drag.p0.x - (e.clientX - drag.x0) / drag.extraW * 100);
      if (drag.extraH > 0.5) pos.y = clamp(drag.p0.y - (e.clientY - drag.y0) / drag.extraH * 100);
      showPos();
    });
    function endDrag() { drag = null; previewEl.classList.remove('dragging'); }
    previewEl.addEventListener('pointerup', endDrag);
    previewEl.addEventListener('pointercancel', endDrag);
    posRowEl.addEventListener('click', function (e) {
      const b = e.target.closest('[data-pos-y]');
      if (!b) return;
      pos = { x: 50, y: +b.dataset.posY };
      showPos();
    });

    showBg();
    showLogo();
    titleInput.value = draft.title || HERO_DEFAULTS.title;
    subtitleInput.value = draft.subtitle || HERO_DEFAULTS.subtitle;

    document.getElementById('hero-cancel').addEventListener('click', closeModal);
    // หน้าต่างนี้ปิดได้เฉพาะปุ่ม × และปุ่มยกเลิก (ไม่ปิดเมื่อคลิกพื้นหลังหรือกด Esc)
    document.getElementById('hero-file').addEventListener('change', async function (e) {
      errorEl.textContent = '';
      const file = e.target.files[0];
      if (!file) return;
      try { draft.image = await compressImage(file, { maxBytes: 780000 }); pos = { x: 50, y: 50 }; showBg(); }
      catch (err) { errorEl.textContent = err.message; }
    });
    document.getElementById('logo-file').addEventListener('change', async function (e) {
      errorEl.textContent = '';
      const file = e.target.files[0];
      if (!file) return;
      try { draft.logo = await compressImage(file, { maxBytes: 200000, keepAlpha: true }); showLogo(); }
      catch (err) { errorEl.textContent = err.message; }
    });

    submitBtn.addEventListener('click', async function () {
      const title = titleInput.value.trim();
      const subtitle = subtitleInput.value.trim();
      // ถ้าตรงกับค่าเริ่มต้น เก็บเป็นค่าว่าง (จะได้ใช้ค่าเริ่มต้นต่อไป)
      draft.title = title === HERO_DEFAULTS.title ? '' : title;
      draft.subtitle = subtitle === HERO_DEFAULTS.subtitle ? '' : subtitle;
      draft.imagePos = draft.image ? fmtPos(pos) : '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังบันทึก...';
      try {
        await FBL.saveHero(draft);
        applyHero(draft);
        closeModal();
      } catch (err) {
        errorEl.textContent = err.message || 'บันทึกไม่สำเร็จ';
        submitBtn.disabled = false;
        submitBtn.textContent = 'บันทึก';
      }
    });
  }

  /* ---------- ปุ่มกุญแจ (ยังไม่เข้าระบบ) / ปุ่มเมนูผู้จัดการ (เข้าระบบแล้ว) ---------- */
  btnOwner.addEventListener('click', function () { openAuthModal(); });

  const ICON = {
    hero: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>',
    arrange: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"></path><path d="M3 8l4-4 4 4"></path><path d="M17 20V4"></path><path d="M21 16l-4 4-4-4"></path></svg>',
    master: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>',
    logout: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>'
  };
  const btnMenu = document.getElementById('btn-menu');
  const ownerMenu = document.getElementById('owner-menu');

  // สร้างรายการในเมนูใหม่ทุกครั้งที่เปิด (หมวดที่จัดลำดับได้ขึ้นกับจำนวนการ์ด ณ ตอนนั้น)
  function openOwnerMenu() {
    let html = '<div class="menu-label">ตั้งค่าหน้านี้</div>' +
      '<button type="button" class="menu-item" role="menuitem" data-act="hero">' + ICON.hero + 'ตั้งค่าหัวเว็บ</button>';
    ['section', 'personal'].forEach(function (catId) {
      const col = CATS[catId].col;
      if (FBL.loaded(col) && FBL.docs(col).length > 1) {
        html += '<button type="button" class="menu-item" role="menuitem" data-act="arrange" data-cat="' + catId + '">' + ICON.arrange +
          '<span>จัดลำดับการ์ด<small>' + escapeAttr(CATS[catId].name) + '</small></span></button>';
      }
    });
    html += '<div class="menu-label">ไปหน้าอื่น</div>' +
      '<a class="menu-item" role="menuitem" href="master-data.html">' + ICON.master + 'ฐานข้อมูลกลาง</a>' +
      '<div class="menu-sep"></div>' +
      '<button type="button" class="menu-item menu-danger" role="menuitem" data-act="logout">' + ICON.logout + 'ออกจากระบบ</button>';
    ownerMenu.innerHTML = html;
    ownerMenu.hidden = false;
    btnMenu.setAttribute('aria-expanded', 'true');
  }
  function closeOwnerMenu() {
    ownerMenu.hidden = true;
    btnMenu.setAttribute('aria-expanded', 'false');
  }
  btnMenu.addEventListener('click', function () {
    if (ownerMenu.hidden) openOwnerMenu(); else closeOwnerMenu();
  });
  // คลิกนอกเมนู หรือกด Esc → ปิดเมนู
  document.addEventListener('click', function (e) {
    if (!ownerMenu.hidden && !e.target.closest('.owner-menu-wrap')) closeOwnerMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !ownerMenu.hidden) { closeOwnerMenu(); btnMenu.focus(); }
  });
  ownerMenu.addEventListener('click', async function (e) {
    const item = e.target.closest('.menu-item');
    if (!item) return;
    closeOwnerMenu();
    const act = item.dataset.act;
    if (act === 'hero') openHeroModal();
    else if (act === 'arrange') { if (confirmLeaveArrange()) startArrange(item.dataset.cat); }
    else if (act === 'logout') { if (confirmLeaveArrange()) await FBL.logout(); }
    // ลิงก์ฐานข้อมูลกลาง: เปลี่ยนหน้าตามปกติ (ถ้ามีลำดับการ์ดที่ยังไม่บันทึก เบราว์เซอร์จะถามก่อน)
  });

  function setOwnerState(owner) {
    isOwner = owner;
    // ยังไม่เข้าระบบ: เห็นแค่ปุ่มกุญแจ / เข้าระบบแล้ว: เห็นแค่ปุ่มเมนู (สีส้ม = กำลังเข้าระบบอยู่)
    btnOwner.style.display = owner ? 'none' : '';
    btnMenu.style.display = owner ? '' : 'none';
    closeOwnerMenu();
    if (!owner) activeCategory = 'all';
    arrange = null; // ออกจากโหมดจัดลำดับเสมอเมื่อเข้า/ออกระบบ
    if (owner) {
      // วาดหน้าทันที (การ์ดงานหมวดที่โหลดไว้แล้วแสดงได้เลย) แล้วค่อยวาดซ้ำเมื่องานส่วนตัวโหลดเสร็จ
      FBL.watch('sites_private', function () { renderCategories(); }).then(renderAll);
      renderAll();
    } else {
      FBL.stop && FBL.stop('sites_private');
      renderAll();
    }
  }

  /* ---------- Modal: ล็อกอิน / ตั้งรหัสผ่านเจ้าของครั้งแรก ---------- */
  function closeModal() { modalRoot.innerHTML = ''; }
  // ปุ่ม × ทุกหน้าต่าง และกด Esc เพื่อปิด
  modalRoot.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalRoot.innerHTML && !document.getElementById('hero-overlay')) closeModal(); });

  // ปุ่มรูปตาในช่องรหัสผ่าน: กดเพื่อสลับแสดง/ซ่อนรหัสผ่าน
  const PW_TOGGLE_BTN = `<button type="button" class="pw-toggle" title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน">
    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
  </button>`;
  modalRoot.addEventListener('click', function (e) {
    const btn = e.target.closest('.pw-toggle');
    if (!btn) return;
    const input = btn.parentElement.querySelector('input');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.classList.toggle('showing', show);
    const label = show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    input.focus();
  });

  async function openAuthModal() {
    if (hasOwnerAccount === null) {
      try { hasOwnerAccount = await FBL.hasOwner(); } catch (e) { hasOwnerAccount = false; }
    }
    const isBootstrap = !hasOwnerAccount;
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="auth-overlay">
        <div class="modal-box">
          <div class="modal-head">
            <div><div class="modal-label">งานส่วนตัว</div><h3>${isBootstrap ? 'ตั้ง ID และรหัสผ่านเจ้าของเว็บ (ครั้งแรก)' : 'เข้าสู่ระบบเจ้าของเว็บ'}</h3></div>
            <button type="button" class="modal-close" data-close title="ปิด">×</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>ID</label>
              <input type="text" id="auth-id" autocomplete="off">
            </div>
            <div class="modal-field">
              <label>รหัสผ่าน${isBootstrap ? ' (อย่างน้อย 6 ตัวอักษร)' : ''}</label>
              <div class="pw-wrap"><input type="password" id="auth-pw" autocomplete="off">${PW_TOGGLE_BTN}</div>
            </div>
            ${isBootstrap ? `
            <div class="modal-field">
              <label>ยืนยันรหัสผ่านอีกครั้ง</label>
              <div class="pw-wrap"><input type="password" id="auth-pw2" autocomplete="off">${PW_TOGGLE_BTN}</div>
            </div>` : ''}
            <div class="modal-error" id="auth-error"></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="auth-cancel">ยกเลิก</button>
            <button type="button" class="btn-primary" id="auth-submit">${isBootstrap ? 'ตั้งรหัสผ่าน' : 'เข้าสู่ระบบ'}</button>
          </div>
        </div>
      </div>`;
    const idInput = document.getElementById('auth-id');
    const pwInput = document.getElementById('auth-pw');
    const errorEl = document.getElementById('auth-error');
    document.getElementById('auth-cancel').addEventListener('click', closeModal);
    document.getElementById('auth-overlay').addEventListener('click', function (e) { if (e.target.id === 'auth-overlay') closeModal(); });

    async function submit() {
      errorEl.textContent = '';
      const id = idInput.value.trim();
      const pw = pwInput.value;
      if (!id) { errorEl.textContent = 'กรอก ID'; return; }
      try {
        if (isBootstrap) {
          const pw2 = document.getElementById('auth-pw2').value;
          if (pw.length < 6) { errorEl.textContent = 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร'; return; }
          if (pw !== pw2) { errorEl.textContent = 'รหัสผ่านสองช่องไม่ตรงกัน'; return; }
          await FBL.bootstrapOwner(id, pw);
          hasOwnerAccount = true;
        } else {
          await FBL.login(id, pw);
        }
        closeModal();
      } catch (e) {
        errorEl.textContent = e.message || 'เกิดข้อผิดพลาด';
      }
    }
    document.getElementById('auth-submit').addEventListener('click', submit);
    idInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') pwInput.focus(); });
    pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    idInput.focus();
  }

  /* ---------- Modal: เพิ่ม / แก้ไข การ์ดระบบ ---------- */
  function openSiteModal(catId, site) {
    const isEdit = !!site;
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="site-overlay">
        <div class="modal-box modal-wide">
          <div class="modal-head">
            <div><div class="modal-label">${escapeAttr(CATS[catId].name)}</div><h3>${isEdit ? 'แก้ไขระบบ' : 'เพิ่มระบบใหม่'}</h3></div>
            <button type="button" class="modal-close" data-close title="ปิด">×</button>
          </div>
          <div class="modal-body">
            <div class="modal-sec"><span class="modal-num">1</span> ข้อมูลระบบ</div>
            <div class="modal-field"><label>ชื่อระบบ <span class="req">*</span></label><input type="text" id="site-name" value="${site ? escapeAttr(site.name) : ''}"></div>
            <div class="modal-field"><label>คำอธิบายสั้นๆ</label><input type="text" id="site-desc" value="${site ? escapeAttr(site.desc || '') : ''}"></div>
            <div class="modal-field"><label>ไอคอน (emoji)</label><input type="text" id="site-icon" value="${site ? escapeAttr(site.icon || '') : '🔗'}" maxlength="4"></div>

            <div class="modal-sec"><span class="modal-num">2</span> ลิงก์</div>
            <div class="modal-field"><label>ลิงก์เปิดระบบ <span class="req">*</span></label><input type="text" id="site-url" value="${site ? escapeAttr(site.url || '') : ''}" placeholder="https://..."></div>
            <div class="field-grid">
              <div class="modal-field"><label>ลิงก์ Firebase (ถ้ามี)</label><input type="text" id="site-firebase" value="${site ? escapeAttr(site.firebaseUrl || '') : ''}" placeholder="https://console.firebase.google.com/..."></div>
              <div class="modal-field"><label>ลิงก์ Github (ถ้ามี)</label><input type="text" id="site-github" value="${site ? escapeAttr(site.githubUrl || '') : ''}" placeholder="https://github.com/..."></div>
            </div>

            <div class="modal-sec"><span class="modal-num">3</span> การแสดงผล</div>
            <div class="modal-field">
              <label>สีแถบข้างการ์ด (เลือกให้ตรงกับสีของเว็บที่จะเปิด)</label>
              <div class="swatch-row" id="site-swatches">
                <button type="button" class="swatch swatch-default" data-color="" title="ตามหมวด">ตามหมวด</button>
                ${ACCENT_PRESETS.map(function (p) {
                  return '<button type="button" class="swatch" data-color="' + p.c + '" title="' + p.n + '" style="background:' + p.c + '"></button>';
                }).join('')}
                <label class="swatch swatch-custom" title="เลือกสีอื่น">🎨<input type="color" id="site-color-custom"></label>
              </div>
            </div>
            <label class="checkbox-row"><input type="checkbox" id="site-rowbreak" ${site && site.rowBreakAfter ? 'checked' : ''}> ขึ้นบรรทัดใหม่หลังการ์ดนี้</label>
            <div class="modal-error" id="site-error"></div>
          </div>
          <div class="modal-actions">
            ${isEdit ? '<button type="button" class="btn-danger" id="site-delete">ลบระบบนี้</button>' : ''}
            <button type="button" class="btn-secondary" id="site-cancel">ยกเลิก</button>
            <button type="button" class="btn-primary" id="site-submit">บันทึก</button>
          </div>
        </div>
      </div>`;
    const errorEl = document.getElementById('site-error');
    // เลือกสีแถบข้าง
    let accentColor = site && isHexColor(site.accentColor) ? site.accentColor.toUpperCase() : '';
    const swatchesEl = document.getElementById('site-swatches');
    const customColorEl = document.getElementById('site-color-custom');
    function showSwatch() {
      let matched = false;
      swatchesEl.querySelectorAll('[data-color]').forEach(function (b) {
        const on = b.dataset.color.toUpperCase() === accentColor;
        b.classList.toggle('selected', on);
        if (on) matched = true;
      });
      const customEl = customColorEl.parentElement;
      customEl.classList.toggle('selected', !matched);
      customEl.style.background = matched ? '' : accentColor;
      if (accentColor) customColorEl.value = accentColor.toLowerCase();
    }
    swatchesEl.addEventListener('click', function (e) {
      const b = e.target.closest('[data-color]');
      if (!b) return;
      accentColor = b.dataset.color.toUpperCase();
      showSwatch();
    });
    customColorEl.addEventListener('input', function () { accentColor = customColorEl.value.toUpperCase(); showSwatch(); });
    showSwatch();
    document.getElementById('site-cancel').addEventListener('click', closeModal);
    document.getElementById('site-overlay').addEventListener('click', function (e) { if (e.target.id === 'site-overlay') closeModal(); });
    if (isEdit) {
      document.getElementById('site-delete').addEventListener('click', async function () {
        if (!confirm('ลบระบบ "' + site.name + '" ออกจากรายการ?')) return;
        try { await FBL.deleteSite(CATS[catId].col, site.__id); closeModal(); }
        catch (e) { errorEl.textContent = e.message || 'ลบไม่สำเร็จ'; }
      });
    }
    document.getElementById('site-submit').addEventListener('click', async function () {
      const name = document.getElementById('site-name').value.trim();
      const url = document.getElementById('site-url').value.trim();
      if (!name || !url) { errorEl.textContent = 'กรอกชื่อระบบและลิงก์เปิดระบบให้ครบ'; return; }
      const payload = {
        __id: site ? site.__id : undefined,
        order: site ? site.order : undefined,
        name: name,
        desc: document.getElementById('site-desc').value.trim(),
        url: url,
        firebaseUrl: document.getElementById('site-firebase').value.trim(),
        githubUrl: document.getElementById('site-github').value.trim(),
        icon: document.getElementById('site-icon').value.trim(),
        accentColor: accentColor,
        rowBreakAfter: document.getElementById('site-rowbreak').checked
      };
      try { await FBL.saveSite(CATS[catId].col, payload); closeModal(); }
      catch (e) { errorEl.textContent = e.message || 'บันทึกไม่สำเร็จ'; }
    });
  }

  // สีสำเร็จรูปของแถบข้างการ์ด — แต่ละสีต่างกันชัด จะได้แยกการ์ดออกง่าย
  const ACCENT_PRESETS = [
    { n: 'น้ำเงินกรมท่า', c: '#1E3A6E' },
    { n: 'ฟ้า', c: '#1E88E5' },
    { n: 'แดงเลือดหมู', c: '#7A1420' },
    { n: 'แดง', c: '#D32F2F' },
    { n: 'ส้ม', c: '#EF6C00' },
    { n: 'ทอง', c: '#C9A227' },
    { n: 'เขียว', c: '#2E7D32' },
    { n: 'ม่วง', c: '#6A1B9A' }
  ];
  function isHexColor(s) { return /^#[0-9A-Fa-f]{6}$/.test(s || ''); }

  function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  /* ---------- Copy link ---------- */
  function copyLink(url, btn) {
    navigator.clipboard.writeText(url).then(function () {
      const toast = btn.querySelector('.btn-tooltip');
      const originalText = toast.textContent;
      btn.classList.add('copied');
      toast.textContent = 'คัดลอกแล้ว';
      toast.classList.add('show');
      setTimeout(function () {
        btn.classList.remove('copied');
        toast.textContent = originalText;
        toast.classList.remove('show');
      }, 1400);
    });
  }

  /* ---------- Render tabs ---------- */
  function renderTabs() {
    tabsEl.innerHTML = '';
    // คนทั่วไปเห็นแค่หมวดเดียว ไม่ต้องมีแถบเลือก — แสดงเฉพาะตอนผู้จัดการเข้าระบบ
    tabsEl.style.display = isOwner ? '' : 'none';
    if (!isOwner) return;
    const ids = ['all', 'section'].concat(isOwner ? ['personal'] : []);
    ids.forEach(function (id) {
      const label = id === 'all' ? 'ทั้งหมด' : CATS[id].name;
      const btn = document.createElement('button');
      btn.className = 'tab' + (id === activeCategory ? ' active' : '');
      btn.textContent = label;
      btn.dataset.cat = id;
      btn.addEventListener('click', function () {
        if (!confirmLeaveArrange()) return;
        activeCategory = id;
        renderTabs();
        renderCategories(true);
      });
      tabsEl.appendChild(btn);
    });
  }

  /* ---------- Render cards ---------- */
  // force = true: วาดใหม่แม้อยู่ระหว่างจัดลำดับ (ใช้ตอนกดปุ่มจัดลำดับ/บันทึก/ยกเลิก)
  function renderCategories(force) {
    // ระหว่างจัดลำดับ ไม่วาดใหม่ตามข้อมูลที่ Firebase ส่งมา ไม่งั้นการ์ดที่ย้ายไว้จะเด้งกลับ
    // (จะวาดใหม่ตามข้อมูลล่าสุดเองตอนกดบันทึกหรือยกเลิก)
    if (arrange && force !== true) return;
    categoriesEl.innerHTML = '';
    const allIds = ['section'].concat(isOwner ? ['personal'] : []);
    const catsToShow = activeCategory === 'all' ? allIds : allIds.filter(function (id) { return id === activeCategory; });

    catsToShow.forEach(function (catId) {
      const cat = CATS[catId];
      const filtered = FBL.docs(cat.col);

      const block = document.createElement('div');
      block.className = 'category-block';

      // คนทั่วไปเห็นหมวดเดียว ชื่อหมวดซ้ำกับชื่อหัวเว็บ — แสดงเฉพาะตอนผู้จัดการเข้าระบบ
      if (isOwner) {
        const title = document.createElement('h2');
        title.className = 'category-title';
        title.innerHTML = '<span class="category-dot ' + cat.dotClass + '"></span>' + cat.name;
        // ระหว่างจัดลำดับหมวดนี้ (เริ่มจากเมนูผู้จัดการ): ปุ่มยกเลิก / บันทึก ข้างชื่อหมวด
        if (arrange && arrange.catId === catId) {
          const bar = document.createElement('div');
          bar.className = 'arrange-bar';
          bar.innerHTML =
            '<span class="arrange-hint">ลาก ⋮⋮ เพื่อย้ายการ์ด</span>' +
            '<button type="button" class="btn-arrange" data-act="cancel">ยกเลิก</button>' +
            '<button type="button" class="btn-arrange btn-primary" data-act="save">บันทึก</button>';
          bar.querySelector('[data-act="cancel"]').addEventListener('click', cancelArrange);
          bar.querySelector('[data-act="save"]').addEventListener('click', function (e) { saveArrange(e.currentTarget, block); });
          title.appendChild(bar);
        }
        block.appendChild(title);
      }

      if (!FBL.loaded(cat.col)) {
        // ยังโหลดข้อมูลหมวดนี้ไม่เสร็จ — แสดง "กำลังโหลด" แทนการ์ดว่าง จะได้ไม่เข้าใจผิดว่าไม่มีระบบ
        const loading = document.createElement('div');
        loading.className = 'empty-state';
        loading.innerHTML = '<p>กำลังโหลด…</p>';
        block.appendChild(loading);
      } else if (filtered.length === 0 && !isOwner) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<p>ยังไม่มีระบบในหมวดนี้</p>';
        block.appendChild(empty);
      } else {
        const grid = document.createElement('div');
        grid.className = 'card-grid';
        // ระหว่างจัดลำดับ: หมวดที่กำลังจัดมีที่จับ ⋮⋮ / ทุกหมวดซ่อนปุ่มแก้ไข-เพิ่มระบบไว้ก่อน
        const isArranging = !!(arrange && arrange.catId === catId);
        if (arrange) grid.classList.add('locked');
        if (isArranging) grid.classList.add('arranging');
        filtered.forEach(function (site) {
          const card = document.createElement('div');
          card.className = 'card ' + cat.cardClass;
          if (isHexColor(site.accentColor)) card.style.setProperty('--card-accent', site.accentColor);
          card.innerHTML =
            '<div class="card-top">' +
              '<span class="card-icon">' + (site.icon || '🔗') + '</span>' +
              '<div>' +
                '<p class="card-name">' + escapeAttr(site.name) + '</p>' +
                '<p class="card-desc">' + escapeAttr(site.desc || '') + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="card-actions">' +
              '<div class="card-actions-main">' +
                '<a class="btn-open" href="' + escapeAttr(site.url) + '" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9 8l4 4-4 4"></path></svg>เปิดระบบ</a>' +
              '</div>' +
              '<div class="card-actions-icons">' +
                (isOwner && site.firebaseUrl ? '<a class="btn-icon btn-firebase" href="' + escapeAttr(site.firebaseUrl) + '" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg><span class="btn-tooltip">เปิด Firebase</span></a>' : '') +
                (isOwner && site.githubUrl ? '<a class="btn-icon btn-github" href="' + escapeAttr(site.githubUrl) + '" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"></path></svg><span class="btn-tooltip">เปิด Github</span></a>' : '') +
                (isOwner ? '<button class="btn-icon btn-copy" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="btn-tooltip">คัดลอกลิงก์</span></button>' : '') +
                (isOwner ? '<button class="btn-icon btn-edit" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg><span class="btn-tooltip">แก้ไข</span></button>' : '') +
              '</div>' +
            '</div>';
          if (isOwner) card.querySelector('.btn-copy').addEventListener('click', function (e) { copyLink(site.url, e.currentTarget); });
          if (isOwner) card.querySelector('.btn-edit').addEventListener('click', function () { openSiteModal(catId, site); });
          card.dataset.id = site.__id;
          if (isArranging) {
            const handle = document.createElement('span');
            handle.className = 'drag-handle';
            handle.title = 'ลากเพื่อย้ายการ์ด';
            handle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.7"></circle><circle cx="15" cy="5" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="19" r="1.7"></circle><circle cx="15" cy="19" r="1.7"></circle></svg>';
            handle.addEventListener('pointerdown', function (e) { startCardDrag(e, card, grid); });
            card.classList.add('has-handle');
            card.appendChild(handle);
          }
          grid.appendChild(card);
          if (site.rowBreakAfter) {
            const rowBreak = document.createElement('div');
            rowBreak.className = 'row-break';
            grid.appendChild(rowBreak);
            card.rowBreakEl = rowBreak; // ตัวดันบรรทัดย้ายตามการ์ดไปด้วยตอนลาก
          }
        });
        if (isOwner && !arrange) {
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'btn-add-card';
          addBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> เพิ่มระบบ';
          addBtn.addEventListener('click', function () { openSiteModal(catId, null); });
          grid.appendChild(addBtn);
        }
        block.appendChild(grid);
      }

      categoriesEl.appendChild(block);
    });
  }

  function renderAll() { renderTabs(); renderCategories(); }

  /* ---------- ลากวางเพื่อย้ายการ์ด (ผู้จัดการเท่านั้น) ----------
     ใช้ได้ในโหมดจัดลำดับเท่านั้น: กดค้างที่ที่จับ ⋮⋮ แล้วลาก การ์ดลอยตามนิ้ว/เมาส์ และสลับที่กับการ์ดที่ชี้อยู่ทันที
     ย้ายได้เฉพาะในหมวดเดียวกัน — ยังไม่บันทึกจนกว่าจะกดปุ่ม "บันทึก" */
  let cardDrag = null;

  function startCardDrag(e, card, grid) {
    if (cardDrag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    const r = card.getBoundingClientRect();
    cardDrag = {
      card: card, grid: grid,
      offX: e.clientX - r.left, offY: e.clientY - r.top,
      from: { next: (card.rowBreakEl || card).nextSibling } // ไว้คืนที่เดิมถ้าถูกขัดจังหวะ
    };
    card.classList.add('dragging');
    document.body.classList.add('is-dragging');
    window.addEventListener('pointermove', moveCardDrag);
    window.addEventListener('pointerup', endCardDrag);
    window.addEventListener('pointercancel', cancelCardDrag);
  }

  function cardIds(grid) {
    return Array.prototype.map.call(grid.querySelectorAll('.card'), function (c) { return c.dataset.id; });
  }

  // วางการ์ดให้ตรงกับตำแหน่งนิ้ว/เมาส์ (คิดจากที่อยู่จริงในตาราง ณ ตอนนี้)
  function placeDraggedCard(x, y) {
    const card = cardDrag.card;
    card.style.transform = '';
    const r = card.getBoundingClientRect();
    card.style.transform = 'translate(' + (x - cardDrag.offX - r.left) + 'px,' + (y - cardDrag.offY - r.top) + 'px)';
  }

  function moveCardDrag(e) {
    if (!cardDrag) return;
    const d = cardDrag;
    // หาการ์ดใบที่นิ้ว/เมาส์ชี้อยู่ แล้วย้ายการ์ดที่ลากไปไว้ตรงนั้น
    const target = Array.prototype.find.call(d.grid.querySelectorAll('.card'), function (c) {
      if (c === d.card) return false;
      const r = c.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    });
    if (target) {
      const cards = Array.prototype.slice.call(d.grid.querySelectorAll('.card'));
      if (cards.indexOf(d.card) < cards.indexOf(target)) {
        const after = target.rowBreakEl || target;
        d.grid.insertBefore(d.card, after.nextSibling);
      } else {
        d.grid.insertBefore(d.card, target);
      }
      if (d.card.rowBreakEl) d.grid.insertBefore(d.card.rowBreakEl, d.card.nextSibling);
    }
    placeDraggedCard(e.clientX, e.clientY);
    // ลากไปใกล้ขอบจอบน/ล่าง ให้หน้าเลื่อนตาม
    const edge = 60;
    if (e.clientY < edge) window.scrollBy(0, -12);
    else if (e.clientY > window.innerHeight - edge) window.scrollBy(0, 12);
  }

  function finishCardDrag() {
    const d = cardDrag;
    window.removeEventListener('pointermove', moveCardDrag);
    window.removeEventListener('pointerup', endCardDrag);
    window.removeEventListener('pointercancel', cancelCardDrag);
    d.card.classList.remove('dragging');
    d.card.style.transform = '';
    document.body.classList.remove('is-dragging');
    cardDrag = null;
    return d;
  }

  // ปล่อยการ์ด: แค่วางไว้ตรงนั้น ยังไม่บันทึก (บันทึกตอนกดปุ่ม "บันทึก")
  function endCardDrag() {
    if (cardDrag) finishCardDrag();
  }

  // ถูกขัดจังหวะ (เช่น มีสายเข้า) — การ์ดใบนั้นกลับไปที่ที่วางล่าสุด
  function cancelCardDrag() {
    if (!cardDrag) return;
    const d = finishCardDrag();
    d.grid.insertBefore(d.card, d.from.next);
    if (d.card.rowBreakEl) d.grid.insertBefore(d.card.rowBreakEl, d.card.nextSibling);
  }

  /* ---------- โหมดจัดลำดับ: กด "จัดลำดับ" → ลากได้หลายครั้ง → กด "บันทึก" หรือ "ยกเลิก" ---------- */
  let arrange = null; // { catId, before: [id เรียงตามเดิม] } ขณะกำลังจัดลำดับ

  function startArrange(catId) {
    arrange = { catId: catId, before: FBL.docs(CATS[catId].col).map(function (s) { return s.__id; }) };
    // หมวดนั้นไม่ได้แสดงอยู่ (อยู่แท็บอื่น) — สลับแท็บให้
    if (activeCategory !== 'all' && activeCategory !== catId) { activeCategory = catId; renderTabs(); }
    renderCategories(true);
    const grid = document.querySelector('.card-grid.arranging');
    if (grid) grid.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function arrangeChanged() {
    const grid = arrange && document.querySelector('.card-grid.arranging');
    return !!grid && cardIds(grid).join('|') !== arrange.before.join('|');
  }

  // ถามก่อนทิ้งลำดับที่ย้ายไว้แต่ยังไม่บันทึก — true = ไปต่อได้
  function confirmLeaveArrange() {
    if (!arrange) return true;
    if (arrangeChanged() && !confirm('ลำดับการ์ดที่ย้ายไว้ยังไม่ได้บันทึก ต้องการยกเลิกการย้ายหรือไม่?')) return false;
    arrange = null;
    return true;
  }

  function cancelArrange() {
    arrange = null;
    renderCategories(true); // วาดใหม่ตามลำดับเดิมในฐานข้อมูล
  }

  async function saveArrange(btn, block) {
    const grid = block.querySelector('.card-grid');
    const ids = cardIds(grid);
    if (ids.join('|') !== arrange.before.join('|')) {
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';
      try {
        await FBL.reorderSites(CATS[arrange.catId].col, ids);
      } catch (err) {
        alert('บันทึกลำดับการ์ดไม่สำเร็จ: ' + (err.message || err));
        btn.disabled = false;
        btn.textContent = 'บันทึก';
        return; // ยังอยู่ในโหมดจัดลำดับ ลองกดบันทึกใหม่ได้
      }
    }
    arrange = null;
    renderCategories(true);
  }

  // ปิด/รีเฟรชหน้าเว็บระหว่างย้ายการ์ดที่ยังไม่บันทึก — ให้เบราว์เซอร์ถามก่อน
  window.addEventListener('beforeunload', function (e) {
    if (arrangeChanged()) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- เริ่มระบบ ---------- */
  if (!window.FBL || !FBL.configured) {
    configBanner.style.display = 'block';
  } else {
    FBL.onError = function (msg) { console.error(msg); };
    FBL.onAuth(function (owner) { setOwnerState(owner); });
    FBL.watch('sites_public', function () { renderCategories(); }).then(renderAll);
    FBL.watchHero(applyHero);
  }
</script>
